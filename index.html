<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASSAM FILMS | Agasobanuye</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1700681411608524" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .page { display: none; }
        .active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .red-gradient { background: linear-gradient(45deg, #e50914, #ff4d4d); }
        
        /* LOADING LINE */
        #loading-line { position: fixed; top: 0; left: 0; height: 3px; background: #e50914; z-index: 9999; width: 0%; transition: width 0.3s, opacity 0.3s; box-shadow: 0 0 10px #e50914; }

        /* SKELETON ANIMATION */
        .skeleton { background: #121212; position: relative; overflow: hidden; border-radius: 1.5rem; }
        .skeleton::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: shimer 1.5s infinite; }
        @keyframes shimer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

        /* BLUR BG */
        #blur-bg { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; filter: blur(60px) brightness(0.2); transform: scale(1.1); transition: 0.7s; display: none; }

        /* PLAY OVERLAY */
        .play-overlay { background: rgba(0,0,0,0.5); opacity: 0; transition: 0.3s; display: flex; align-items: center; justify-content: center; position: absolute; inset: 0; }
        .group:hover .play-overlay { opacity: 1; }
        .play-btn { background: #e50914; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transform: scale(0.6); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .group:hover .play-btn { transform: scale(1); }

        .whatsapp-float { position: fixed; bottom: 20px; right: 20px; background: #25d366; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; z-index: 200; }
    </style>
</head>
<body>

    <div id="loading-line"></div>
    <div id="blur-bg"></div>

    <a href="https://wa.me/250781626371" target="_blank" class="whatsapp-float shadow-lg"><i class="fab fa-whatsapp"></i></a>

    <nav class="fixed w-full z-[100] px-4 md:px-10 py-3 flex justify-between items-center glass">
        <div onclick="showPage('home')" class="flex items-center gap-4 cursor-pointer">
            <div class="h-10 w-10 bg-red-600 rounded-lg flex items-center justify-center font-black italic text-xl shadow-xl">BF</div>
            <h1 class="text-white text-lg font-black uppercase tracking-tighter">BASSAM FILMS</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="showPage('login')" class="red-gradient px-4 py-1.5 rounded-full text-[10px] font-black uppercase shadow-lg">Admin</button>
        </div>
    </nav>

    <section id="page-home" class="page active pt-24 min-h-screen">
        <div class="px-4 md:px-10 mt-4 mb-6">
            <input type="text" id="searchInput" oninput="searchMovies()" placeholder="Shakisha filime..." class="w-full bg-zinc-900/50 border border-white/10 py-4 px-6 rounded-2xl text-sm outline-none focus:border-red-600 transition backdrop-blur-sm">
        </div>
        <div id="movieGrid" class="px-4 md:px-10 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6 pb-20">
            <div class="space-y-3"><div class="aspect-[2/3] skeleton"></div><div class="h-3 w-2/3 skeleton"></div></div>
            <div class="space-y-3"><div class="aspect-[2/3] skeleton"></div><div class="h-3 w-2/3 skeleton"></div></div>
            <div class="space-y-3"><div class="aspect-[2/3] skeleton"></div><div class="h-3 w-2/3 skeleton"></div></div>
            <div class="space-y-3"><div class="aspect-[2/3] skeleton"></div><div class="h-3 w-2/3 skeleton"></div></div>
        </div>
    </section>

    <section id="page-details" class="page pt-24 min-h-screen pb-20">
        <div class="px-4 md:px-10 max-w-6xl mx-auto">
            <button onclick="showPage('home')" class="mb-6 text-[10px] text-zinc-400 font-black uppercase hover:text-white transition">← Subira Inyuma</button>
            <div id="trailerBox" class="aspect-video w-full rounded-3xl bg-zinc-900 overflow-hidden shadow-2xl border border-white/5"></div>
            
            <div class="flex flex-wrap gap-4 mt-8">
                <a id="watchBtn" href="#" target="_blank" class="flex-1 min-w-[140px] red-gradient py-4 rounded-2xl text-center font-black uppercase text-sm shadow-xl flex items-center justify-center gap-2"><i class="fa fa-play"></i> Reba Filime</a>
                <a id="downloadBtn" href="#" target="_blank" class="flex-1 min-w-[140px] bg-white text-black py-4 rounded-2xl text-center font-black uppercase text-sm shadow-xl flex items-center justify-center gap-2"><i class="fa fa-download"></i> Download</a>
            </div>

            <div class="mt-12 p-6 bg-zinc-900/40 rounded-3xl border border-white/5 backdrop-blur-md">
                <h3 class="text-xs font-black uppercase text-red-600 mb-4">Siga ubutumwa</h3>
                <div class="space-y-3">
                    <input type="text" id="comName" placeholder="Izina ryawe" class="w-full bg-black border border-zinc-800 p-3 rounded-xl text-xs outline-none text-white focus:border-red-600">
                    <textarea id="comMsg" placeholder="Andika hano..." class="w-full bg-black border border-zinc-800 p-3 rounded-xl text-xs outline-none h-20 text-white focus:border-red-600"></textarea>
                    <button onclick="sendComment()" class="red-gradient px-6 py-2.5 rounded-xl font-black uppercase text-[10px]">Ohereza</button>
                </div>
            </div>
        </div>
    </section>

    <section id="page-login" class="page pt-44 h-screen px-6">
        <div class="max-w-md mx-auto glass p-10 rounded-[2.5rem] text-center border border-white/5 shadow-2xl">
            <h2 class="text-2xl font-black mb-8 text-red-600 italic uppercase">Admin Access</h2>
            <div class="space-y-4">
                <input type="text" id="userIn" placeholder="Username" class="w-full bg-black border border-zinc-800 p-4 rounded-xl outline-none text-white">
                <input type="password" id="passIn" placeholder="Password" class="w-full bg-black border border-zinc-800 p-4 rounded-xl outline-none text-white">
                <button onclick="handleLogin()" class="w-full red-gradient py-4 rounded-xl font-black uppercase shadow-lg">Injira</button>
            </div>
        </div>
    </section>

    <section id="page-admin" class="page pt-28 px-4 md:px-10 min-h-screen pb-20">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-xl font-black text-red-600 uppercase italic">Admin Dashboard</h2>
                <button onclick="showPage('home')" class="bg-zinc-800 px-4 py-2 rounded-lg text-[10px] font-bold">LOGOUT</button>
            </div>
            
            <div class="grid lg:grid-cols-2 gap-10">
                <div class="glass p-8 rounded-3xl border border-white/5 h-fit">
                    <h3 class="text-xs font-black mb-4 uppercase">Ongeramo Filime</h3>
                    <div class="space-y-3">
                        <input type="text" id="mTitle" placeholder="Izina rya filime" class="w-full bg-black p-3 rounded-lg border border-zinc-800 text-xs">
                        <input type="text" id="mSoba" placeholder="Umusobanuzi" class="w-full bg-black p-3 rounded-lg border border-zinc-800 text-xs">
                        <input type="text" id="mPoster" placeholder="Poster URL" class="w-full bg-black p-3 rounded-lg border border-zinc-800 text-xs">
                        <input type="text" id="mLink" placeholder="Watch Link (YouTube)" class="w-full bg-black p-3 rounded-lg border border-zinc-800 text-xs">
                        <input type="text" id="mDL" placeholder="Download Link" class="w-full bg-black p-3 rounded-lg border border-zinc-800 text-xs">
                        <button onclick="saveToFirebase()" class="w-full red-gradient py-3 rounded-lg font-black text-xs uppercase mt-4">Bika Filime</button>
                    </div>
                </div>
                <div class="space-y-3">
                    <h3 class="text-xs font-black uppercase opacity-50">Filime zanditse</h3>
                    <div id="adminList" class="space-y-2 max-h-[500px] overflow-y-auto no-scrollbar"></div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBlq2acq1pUcZAecjemVxS1UoVaPrOMAQc",
            authDomain: "bassamfilms-1d584.firebaseapp.com",
            databaseURL: "https://bassamfilms-1d584-default-rtdb.firebaseio.com",
            projectId: "bassamfilms-1d584",
            storageBucket: "bassamfilms-1d584.firebasestorage.app",
            messagingSenderId: "313527595091",
            appId: "1:313527595091:web:53847778813445832a56a6"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allMovies = [];

        // UI Helpers
        function startLoading() { 
            const lb = document.getElementById('loading-line');
            lb.style.opacity = '1';
            lb.style.width = '70%'; 
        }
        function finishLoading() { 
            const lb = document.getElementById('loading-line');
            lb.style.width = '100%';
            setTimeout(() => { lb.style.opacity = '0'; lb.style.width = '0%'; }, 300);
        }

        function showPage(id) {
            startLoading();
            setTimeout(() => {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(`page-${id}`).classList.add('active');
                document.getElementById('blur-bg').style.display = (id === 'details') ? 'block' : 'none';
                finishLoading();
                window.scrollTo(0,0);
            }, 300);
        }

        function handleLogin() {
            const u = document.getElementById('userIn').value;
            const p = document.getElementById('passIn').value;
            if(u === "bassam" && p === "54321") {
                showPage('admin');
                renderAdmin();
            } else {
                alert("Ntabwo wemewe!");
            }
        }

        // Core Functions
        database.ref('movies').on('value', (snap) => {
            allMovies = [];
            snap.forEach(child => { allMovies.push({id: child.key, ...child.val()}); });
            renderHome(allMovies.reverse());
            if(document.getElementById('page-admin').classList.contains('active')) renderAdmin();
        });

        function renderHome(movies) {
            const grid = document.getElementById('movieGrid');
            if(movies.length === 0) return;
            grid.innerHTML = movies.map(m => `
                <div onclick="openMovie('${m.id}')" class="group cursor-pointer">
                    <div class="aspect-[2/3] relative rounded-[1.5rem] overflow-hidden bg-zinc-900 border border-white/5 shadow-xl">
                        <img src="${m.poster}" class="w-full h-full object-cover transition duration-500 group-hover:scale-110" loading="lazy">
                        <div class="play-overlay">
                            <div class="play-btn"><i class="fa fa-play text-white"></i></div>
                        </div>
                    </div>
                    <h4 class="mt-3 text-[10px] font-black uppercase text-zinc-200 truncate">${m.title}</h4>
                    <p class="text-[8px] text-red-600 font-bold italic">${m.soba || ''}</p>
                </div>
            `).join('');
        }

        function openMovie(id) {
            const m = allMovies.find(i => i.id === id);
            if(!m) return;
            startLoading();
            
            document.getElementById('blur-bg').style.backgroundImage = `url('${m.poster}')`;
            const ytId = m.link.includes('v=') ? m.link.split('v=')[1].split('&')[0] : m.link.split('/').pop();
            document.getElementById('trailerBox').innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytId}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;
            document.getElementById('watchBtn').href = m.link;
            document.getElementById('downloadBtn').href = m.download;
            
            showPage('details');
        }

        function saveToFirebase() {
            const data = {
                title: document.getElementById('mTitle').value,
                soba: document.getElementById('mSoba').value,
                poster: document.getElementById('mPoster').value,
                link: document.getElementById('mLink').value,
                download: document.getElementById('mDL').value
            };
            if(!data.title || !data.link) return alert("Uzuza neza!");
            database.ref('movies').push(data).then(() => {
                alert("Byabitswe!");
                document.querySelectorAll('#page-admin input').forEach(i => i.value = "");
            });
        }

        function renderAdmin() {
            document.getElementById('adminList').innerHTML = allMovies.map(m => `
                <div class="flex items-center justify-between glass p-3 rounded-xl border border-white/5">
                    <div class="flex items-center gap-3">
                        <img src="${m.poster}" class="h-8 w-6 rounded object-cover">
                        <span class="text-[10px] font-bold uppercase truncate w-32">${m.title}</span>
                    </div>
                    <button onclick="deleteMovie('${m.id}')" class="h-8 w-8 rounded-lg bg-red-600/10 text-red-500 flex items-center justify-center hover:bg-red-600 hover:text-white transition"><i class="fa fa-trash text-xs"></i></button>
                </div>
            `).join('');
        }

        function deleteMovie(id) { if(confirm("Urakoze gusiba iyi filime?")) database.ref('movies/' + id).remove(); }

        function searchMovies() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMovies.filter(m => m.title.toLowerCase().includes(q));
            renderHome(filtered);
        }

        function sendComment() {
            const n = document.getElementById('comName').value;
            const m = document.getElementById('comMsg').value;
            if(!n || !m) return;
            database.ref('comments').push({ name: n, msg: m, date: new Date().toLocaleString() }).then(() => {
                alert("Ubutumwa bwoherejwe!");
                document.getElementById('comName').value = "";
                document.getElementById('comMsg').value = "";
            });
        }
    </script>
</body>
</html>
