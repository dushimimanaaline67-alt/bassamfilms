    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap');

        :root{
            --bg: #0b0b0d;
            --surface: #181818;
            --surface-2: #232323;
            --accent: #e50914;
            --accent-dim: #b20710;
            --text: #f5f5f1;
            --text-dim: #a3a3a3;
        }

        *{ -webkit-tap-highlight-color: transparent; }
        html{ scroll-behavior: smooth; }
        body{
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        h1,h2,h3,.display{ font-family:'Bebas Neue', 'Inter', sans-serif; letter-spacing:0.02em; }

        /* Accessibility: visible focus + skip link */
        a, button, input, textarea, [tabindex]{ outline-offset: 2px; }
        a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
            outline: 3px solid #fff; outline-offset: 3px; border-radius: 6px;
        }
        .skip-link{
            position:absolute; left:-999px; top:0; background:var(--accent); color:#fff;
            padding:12px 20px; z-index:9999; font-weight:700; border-radius:0 0 10px 0;
        }
        .skip-link:focus{ left:0; }

        .page{ display:none; }
        .active{ display:block; animation: fadeIn 0.4s cubic-bezier(0.16,1,0.3,1); }
        @keyframes fadeIn{ from{opacity:0; transform:translateY(15px);} to{opacity:1; transform:translateY(0);} }

        .glass{ background: rgba(10,10,12,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .red-gradient{ background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%); box-shadow: 0 4px 20px rgba(229,9,20,0.3); }
        .red-gradient:hover{ background: linear-gradient(135deg, #ff1e27 0%, var(--accent) 100%); box-shadow: 0 6px 26px rgba(229,9,20,0.5); }

        #loading-line{ position:fixed; top:0; left:0; height:3px; background:linear-gradient(90deg,var(--accent),#ff4d4d); z-index:9999; width:0%; transition:width .4s ease, opacity .3s; box-shadow:0 0 15px var(--accent); }

        .skeleton{ background:#151515; position:relative; overflow:hidden; border-radius:0.5rem; }
        .skeleton::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent); animation:shimmer 1.5s infinite; }
        @keyframes shimmer{ from{transform:translateX(-100%);} to{transform:translateX(100%);} }

        #blur-bg{ position:fixed; inset:0; z-index:-1; background-size:cover; background-position:center; filter:blur(70px) brightness(0.15); transform:scale(1.15); transition:0.8s ease; display:none; }

        .no-scrollbar::-webkit-scrollbar{ display:none; }
        .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

        /* ---------- NAV ---------- */
        #mainNav{
            position:fixed; top:0; left:0; right:0; z-index:100;
            padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
            background:linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
            transition: background .35s ease;
        }
        #mainNav.nav-solid{ background: #0b0b0d; box-shadow: 0 2px 20px rgba(0,0,0,0.6); }
        @media (min-width:768px){ #mainNav{ padding:16px 48px; } }

        #searchWrap{ width:0; overflow:hidden; transition:width .3s ease; display:flex; align-items:center; background:rgba(0,0,0,0.75); border:1px solid rgba(255,255,255,0.15); border-radius:6px; }
        #searchWrap.open{ width:min(60vw,280px); }
        #searchWrap input{ background:transparent; border:none; color:#fff; padding:9px 12px; width:100%; outline:none; font-size:14px; }

        /* ---------- HERO ---------- */
        .hero{ position:relative; width:100%; height:78vh; min-height:420px; overflow:hidden; }
        .hero-bg{ position:absolute; inset:0; background-size:cover; background-position:center 20%; animation: kenburns 22s ease-in-out infinite alternate; }
        @keyframes kenburns{ from{ transform:scale(1); } to{ transform:scale(1.09); } }
        .hero-fade{ position:absolute; inset:0; background: linear-gradient(0deg, var(--bg) 2%, transparent 45%), linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 55%); }
        .hero-content{ position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:0 20px 56px; max-width:640px; }
        @media (min-width:768px){ .hero-content{ padding:0 48px 72px; } }

        @media (min-width:768px){ .hero-title{ font-size:4.4rem; } }

        /* ---------- GENRE CHIPS ---------- */
        #chipBar{ position:sticky; top:64px; z-index:40; display:flex; gap:8px; overflow-x:auto; padding:14px 16px; background:linear-gradient(180deg, var(--bg) 60%, transparent); }

        .chip:hover{ border-color:rgba(255,255,255,0.3); color:#fff; }
        .chip.active{ background:#fff; color:#000; border-color:#fff; }

        /* ---------- ROWS ---------- */
        .row{ margin: 34px 0; }
        .row-title{ font-size:1.3rem; padding:0 16px; margin-bottom:12px; color:#f2f2f2; font-weight:800; font-family:'Inter',sans-serif; letter-spacing:0; }
        @media (min-width:768px){ .row-title{ padding:0 48px; } }
        .row-track{ display:flex; gap:10px; overflow-x:auto; padding:10px 16px 20px; scroll-snap-type:x proximity; }
        @media (min-width:768px){ .row-track{ padding:10px 48px 24px; gap:12px; } }

        .card-wrap{ position:relative; flex:0 0 auto; width:130px; scroll-snap-align:start; cursor:pointer; display:flex; align-items:flex-end; }
        @media (min-width:640px){ .card-wrap{ width:170px; } }

        .rank-num{
            font-family:'Bebas Neue', sans-serif; font-size:6.5rem; line-height:1; color:transparent;
            -webkit-text-stroke: 2px #3a3a3a; margin-right:-22px; user-select:none; align-self:flex-end;
            transition: -webkit-text-stroke-color .3s ease;
        }
        .card-wrap:hover .rank-num, .card-wrap:focus-within .rank-num{ -webkit-text-stroke-color: var(--accent); }

        .card{ position:relative; aspect-ratio:2/3; width:100%; border-radius:8px; overflow:hidden; background:var(--surface); border:1px solid rgba(255,255,255,0.06); transition: transform .28s cubic-bezier(0.34,1.56,0.64,1), box-shadow .28s ease, z-index 0s; z-index:1; }
        .card img{ width:100%; height:100%; object-fit:cover; display:block; }
        .card-wrap:hover .card, .card-wrap:focus-within .card{ transform:scale(1.12) translateY(-6px); box-shadow:0 20px 40px rgba(0,0,0,0.6); z-index:5; }

        .card-overlay{ position:absolute; inset:0; background:linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 55%); opacity:0; transition:opacity .28s ease; display:flex; flex-direction:column; justify-content:flex-end; padding:10px; }

        .play-btn-sm{ width:30px; height:30px; border-radius:50%; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; margin-bottom:6px; font-size:12px; }
        .card-title{ font-size:11px; font-weight:700; color:#fff; line-height:1.2; }

        .genre-badge{ display:inline-block; padding:4px 12px; border-radius:999px; background:rgba(229,9,20,0.15); color:#ff5b62; border:1px solid rgba(229,9,20,0.35); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; }

        @media (min-width:640px){ .grid-results{ grid-template-columns:repeat(3,1fr); } }
        @media (min-width:768px){ .grid-results{ grid-template-columns:repeat(4,1fr); padding:0 48px 60px; } }

        .grid-results .card-wrap{ width:100%; }
        .grid-results .rank-num{ display:none; }

        .play-overlay{ background:rgba(0,0,0,0.55); opacity:0; transition:opacity .3s; display:flex; align-items:center; justify-content:center; position:absolute; inset:0; }
        .group:hover .play-overlay{ opacity:1; }

        .group:hover .play-btn{ transform:scale(1); }

        @media (prefers-reduced-motion: reduce){
            *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
        }
    </style>
</head>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBlq2acq1pUcZAecjemVxS1UoVaPrOMAQc",
            authDomain: "bassamfilms-1d584.firebaseapp.com",
            databaseURL: "https://bassamfilms-1d584-default-rtdb.firebaseio.com",
            projectId: "bassamfilms-1d584",
            storageBucket: "bassamfilms-1d584.firebasestorage.app",
            messagingSenderId: "313527595091",
            appId: "1:313527595091:web:53847778813445832a56a6"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allMovies = [];
        const GENRES = ["Action","Drama","Horror","Comedy","Romance","Thriller","Animation","Documentary","Sci-Fi","Adventure"];
        let activeGenre = 'all';

        // ---------- helpers ----------
        function escapeHtml(str){
            return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function startLoading(){
            const lb = document.getElementById('loading-line');
            lb.style.opacity = '1';
            lb.style.width = '70%';
        }
        function finishLoading(){
            const lb = document.getElementById('loading-line');
            lb.style.width = '100%';
            setTimeout(() => { lb.style.opacity = '0'; lb.style.width = '0%'; }, 300);
        }

        function showPage(id){
            startLoading();
            setTimeout(() => {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(`page-${id}`).classList.add('active');
                document.getElementById('blur-bg').style.display = (id === 'details') ? 'block' : 'none';
                finishLoading();
                window.scrollTo(0,0);
            }, 300);
        }

        function handleLogin(){
            const u = document.getElementById('userIn').value;
            const p = document.getElementById('passIn').value;
            if(u === "bassam" && p === "54321"){
                showPage('admin');
                renderAdmin();
            } else {
                alert("Ntabwo wemewe!");
            }
        }

        function toggleSearch(){
            const wrap = document.getElementById('searchWrap');
            wrap.classList.toggle('open');
            if(wrap.classList.contains('open')){
                document.getElementById('searchInput').focus();
            } else {
                document.getElementById('searchInput').value = '';
                searchMovies();
            }
        }

        // nav background on scroll
        window.addEventListener('scroll', () => {
            document.getElementById('mainNav').classList.toggle('nav-solid', window.scrollY > 40);
        });

        // ---------- Core Firebase listener ----------
        database.ref('movies').on('value', (snap) => {
            allMovies = [];
            snap.forEach(child => { allMovies.push({id: child.key, ...child.val()}); });
            allMovies.reverse();
            renderHome(allMovies);
            if(document.getElementById('page-admin').classList.contains('active')) renderAdmin();
        });

        // ---------- Home: hero + chips + rows ----------
        function renderHome(movies){
            renderHero(movies);
            renderChips(movies);
            renderRows(movies);
            // keep current filter/search applied after data refresh
            if(activeGenre !== 'all'){
                applyGenreFilter(activeGenre);
            } else if(document.getElementById('searchInput').value.trim()){
                searchMovies();
            }
        }

        function groupByGenre(movies){
            const groups = {};
            GENRES.forEach(g => groups[g] = []);
            groups['Ibindi'] = [];
            movies.forEach(m => {
                const g = GENRES.includes(m.genre) ? m.genre : 'Ibindi';
                groups[g].push(m);
            });
            return groups;
        }

        function renderChips(movies){
            const chipBar = document.getElementById('chipBar');
            const groups = groupByGenre(movies);
            const present = Object.keys(groups).filter(g => groups[g].length);
            let html = `<button class="chip ${activeGenre==='all' ? 'active':''}" role="tab" aria-selected="${activeGenre==='all'}" onclick="filterByGenre('all', this)">Byose</button>`;
            html += present.map(g => `<button class="chip ${activeGenre===g ? 'active':''}" role="tab" aria-selected="${activeGenre===g}" onclick="filterByGenre('${g}', this)">${g}</button>`).join('');
            chipBar.innerHTML = html;
        }

        function filterByGenre(genre, btn){
            activeGenre = genre;
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.chip').forEach(c => { c.classList.remove('active'); c.setAttribute('aria-selected','false'); });
            if(btn){ btn.classList.add('active'); btn.setAttribute('aria-selected','true'); }
            if(genre === 'all'){ showDefaultView(); return; }
            applyGenreFilter(genre);
        }

        function applyGenreFilter(genre){
            const groups = groupByGenre(allMovies);
            showBrowseGrid(groups[genre] || [], `Nta filime yo mu bwoko bwa ${escapeHtml(genre)} ziboneka ubu...`);
        }

        function showDefaultView(){
            document.getElementById('heroSection').classList.remove('hidden');
            document.getElementById('rowsContainer').classList.remove('hidden');
            document.getElementById('searchResults').classList.add('hidden');
        }

        function showBrowseGrid(list, emptyMsg){
            const heroSection = document.getElementById('heroSection');
            const rowsContainer = document.getElementById('rowsContainer');
            const searchResults = document.getElementById('searchResults');
            heroSection.classList.add('hidden');
            rowsContainer.classList.add('hidden');
            searchResults.classList.remove('hidden');
            searchResults.innerHTML = list.length
                ? `<div class="grid-results">${list.map(m => cardHTML(m, null)).join('')}</div>`
                : `<div class="text-center py-16 text-zinc-500 text-sm px-4">${emptyMsg}</div>`;
        }

        function renderHero(movies){
            const heroSection = document.getElementById('heroSection');
            if(movies.length === 0){
                heroSection.innerHTML = `<div class="hero"><div class="hero-bg skeleton"></div></div>`;
                return;
            }
            const m = movies[0];
            heroSection.innerHTML = `
                <div class="hero">
                    <div class="hero-bg" style="background-image:url('${m.poster}')"></div>
                    <div class="hero-fade"></div>
                    <div class="hero-content">
                        <span class="text-red-500 text-xs font-extrabold uppercase tracking-widest mb-2 block">Ejo Bundi Byongeye</span>
                        <h2 class="hero-title">${escapeHtml(m.title)}</h2>
                        ${m.soba ? `<p class="hero-desc">${escapeHtml(m.soba)}</p>` : ''}
                        <div class="flex flex-wrap gap-3 mt-6">
                            <button onclick="openMovie('${m.id}')" class="bg-white hover:bg-zinc-200 text-black px-7 py-3 rounded-lg font-bold text-sm flex items-center gap-2 transition transform active:scale-95">
                                <i class="fa fa-play" aria-hidden="true"></i> Reba Ubu
                            </button>
                            <button onclick="openMovie('${m.id}')" class="bg-zinc-700/70 hover:bg-zinc-600/80 text-white px-7 py-3 rounded-lg font-bold text-sm flex items-center gap-2 transition transform active:scale-95 border border-white/10">
                                <i class="fa fa-circle-info" aria-hidden="true"></i> Amakuru Arambuye
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function cardHTML(m, rank){
            return `
                <div class="card-wrap" onclick="openMovie('${m.id}')" tabindex="0" role="button" aria-label="Reba ${escapeHtml(m.title)}" onkeydown="if(event.key==='Enter')openMovie('${m.id}')">
                    ${rank ? `<span class="rank-num" aria-hidden="true">${rank}</span>` : ''}
                    <div class="card">
                        <img src="${m.poster}" alt="${escapeHtml(m.title)}" loading="lazy">
                        <div class="card-overlay">
                            <div class="play-btn-sm"><i class="fa fa-play" aria-hidden="true"></i></div>
                            <p class="card-title">${escapeHtml(m.title)}</p>
                            ${m.genre ? `<p class="text-[9px] text-red-400 font-bold uppercase tracking-wide mt-0.5">${escapeHtml(m.genre)}</p>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function buildRow(title, list, ranked){
            return `
                <div class="row">
                    <h2 class="row-title">${title}</h2>
                    <div class="row-track no-scrollbar">
                        ${list.map((m,i) => cardHTML(m, ranked ? i+1 : null)).join('')}
                    </div>
                </div>
            `;
        }

        function renderRows(movies){
            const rowsContainer = document.getElementById('rowsContainer');
            if(movies.length === 0){
                rowsContainer.innerHTML = `<div class="text-center py-16 text-zinc-500 text-sm px-4">Nta filime yabonetse. Reba nyuma yaho.</div>`;
                return;
            }
            const top10 = movies.slice(0, 10);
            let html = '';
            if(top10.length >= 3){
                html += buildRow('Ibyakunzwe Cyane #1 Muri Rwanda Uyu Munsi', top10, true);
            }
            html += buildRow('Ibyongeye Vuba', movies, false);

            const groups = groupByGenre(movies);
            GENRES.concat(['Ibindi']).forEach(g => {
                if(groups[g] && groups[g].length){
                    html += buildRow(g, groups[g], false);
                }
            });

            rowsContainer.innerHTML = html;
        }

        // ---------- Search ----------
        function searchMovies(){
            const q = document.getElementById('searchInput').value.trim().toLowerCase();

            if(!q){
                if(activeGenre !== 'all'){ applyGenreFilter(activeGenre); } else { showDefaultView(); }
                return;
            }

            // typing a search resets the genre chip back to "Byose" visually
            if(activeGenre !== 'all'){
                activeGenre = 'all';
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                const allChip = document.querySelector('#chipBar .chip');
                if(allChip) allChip.classList.add('active');
            }

            const filtered = allMovies.filter(m => m.title.toLowerCase().includes(q));
            showBrowseGrid(filtered, "Nta filime yabonetse ihuye n'ubushakashatsi bwawe...");
        }

        // ---------- Movie details ----------
        function openMovie(id){
            const m = allMovies.find(i => i.id === id);
            if(!m) return;
            startLoading();

            document.getElementById('blur-bg').style.backgroundImage = `url('${m.poster}')`;

            document.getElementById('detailsHeader').innerHTML = `
                <h1 class="text-2xl md:text-4xl font-black text-white mb-2">${escapeHtml(m.title)}</h1>
                <div class="flex items-center gap-3 flex-wrap">
                    ${m.genre ? `<span class="genre-badge">${escapeHtml(m.genre)}</span>` : ''}
                    ${m.soba ? `<p class="text-sm text-zinc-400">${escapeHtml(m.soba)}</p>` : ''}
                </div>
            `;

            const ytId = m.link.includes('v=') ? m.link.split('v=')[1].split('&')[0] : m.link.split('/').pop();
            document.getElementById('trailerBox').innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytId}?autoplay=1" title="${escapeHtml(m.title)}" frameborder="0" allowfullscreen></iframe>`;
            document.getElementById('watchBtn').href = m.link;
            document.getElementById('downloadBtn').href = m.download;

            showPage('details');
        }

        // ---------- Admin ----------
        function saveToFirebase(){
            const data = {
                title: document.getElementById('mTitle').value,
                soba: document.getElementById('mSoba').value,
                genre: document.getElementById('mGenre').value,
                poster: document.getElementById('mPoster').value,
                link: document.getElementById('mLink').value,
                download: document.getElementById('mDL').value
            };
            if(!data.title || !data.link) return alert("Uzuza neza!");
            database.ref('movies').push(data).then(() => {
                alert("Byabitswe!");
                document.querySelectorAll('#page-admin input').forEach(i => i.value = "");
                document.getElementById('mGenre').value = "";
            });
        }

        function renderAdmin(){
            document.getElementById('adminList').innerHTML = allMovies.map(m => `
                <div class="flex items-center justify-between glass p-4 rounded-xl border border-white/10 shadow-sm hover:border-white/20 transition">
                    <div class="flex items-center gap-4 min-w-0">
                        <img src="${m.poster}" alt="" class="h-12 w-9 rounded-lg object-cover bg-zinc-800 border border-white/10 flex-shrink-0">
                        <div class="min-w-0">
                            <span class="text-xs font-bold text-white block truncate max-w-[180px] sm:max-w-xs">${escapeHtml(m.title)}</span>
                            <span class="text-[10px] text-zinc-400 block truncate">${escapeHtml(m.soba) || 'Nta musobanuzi'}</span>
                            ${m.genre ? `<span class="text-[9px] text-red-500 font-bold uppercase tracking-wide">${escapeHtml(m.genre)}</span>` : ''}
                        </div>
                    </div>
                    <button onclick="deleteMovie('${m.id}')" aria-label="Siba ${escapeHtml(m.title)}" class="h-9 w-9 rounded-xl bg-red-600/10 text-red-500 flex items-center justify-center hover:bg-red-600 hover:text-white transition flex-shrink-0"><i class="fa fa-trash text-xs" aria-hidden="true"></i></button>
                </div>
            `).join('');
        }

        function deleteMovie(id){ if(confirm("Urakoze gusiba iyi filime?")) database.ref('movies/' + id).remove(); }

        // ---------- Comments ----------
        function sendComment(){
            const n = document.getElementById('comName').value;
            const m = document.getElementById('comMsg').value;
            if(!n || !m) return alert("Uzuza neza ibikenewe!");
            database.ref('comments').push({ name: n, msg: m, date: new Date().toLocaleString() }).then(() => {
                alert("Ubutumwa bwoherejwe!");
                document.getElementById('comName').value = "";
                document.getElementById('comMsg').value = "";
            });
        }
    </script>
</body>
</html>
